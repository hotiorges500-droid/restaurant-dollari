<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri | DOLLARI</title>
    <meta name="description" content="Galeria e Restaurant DOLLARI, me fotografi të ambientit, ushqimeve dhe atmosferës." />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="brand" aria-label="Restaurant DOLLARI home">
          <span class="brand-mark">$</span>
          <span>DOLLARI</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="about.html">Rreth Nesh</a>
          <a href="gallery.html" class="active">Galeri</a>
          <a href="contact.html#location">Lokacioni</a>
          <a href="contact.html">Kontakti</a>
        </nav>

        <div class="nav-actions">
          <a href="contact.html" class="btn btn-primary">Rezervo</a>
          <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        </div>
      </div>
    </header>

    <main>
      <section class="page-hero small-hero">
        <div class="hero-overlay"></div>
        <div class="container page-hero-inner">
          <p class="eyebrow">Galeri</p>
          <h1>Ambienti dhe shijimet tona</h1>
        </div>
      </section>

      <section class="section-spacing">
        <div class="container">
          <div class="gallery-grid">
            <figure class="gallery-item">
              <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=900&q=80" alt="Restaurant interior" />
            </figure>

            <figure class="gallery-item">
              <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80" alt="Restaurant tables" />
            </figure>

            <figure class="gallery-item">
              <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=80" alt="Grilled food" />
            </figure>

            <figure class="gallery-item">
              <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=900&q=80" alt="Pizza" />
            </figure>

            <figure class="gallery-item">
              <img src="https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=900&q=80" alt="Breakfast meal" />
            </figure>

            <figure class="gallery-item">
              <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=900&q=80" alt="Food platter" />
            </figure>
          </div>
        </div>
      </section>
    </main>

    <div class="lightbox" aria-hidden="true">
      <button class="lightbox-close" aria-label="Close gallery"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      <button class="lightbox-prev" aria-label="Previous image"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <img src="" alt="Expanded gallery image" class="lightbox-image" />
      <button class="lightbox-next" aria-label="Next image"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>

    <footer class="site-footer">
      <div class="container footer-content">
        <div>
          <a href="index.html" class="brand footer-brand">
            <span class="brand-mark">D</span>
            <span>DOLLARI</span>
          </a>
          <p class="footer-text">Restaurant DOLLARI</p>
          <p class="footer-text">Ratkoc, Rahovec, Kosovë</p>
        </div>

        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="about.html">Rreth Nesh</a>
          <a href="gallery.html">Galeri</a>
          <a href="contact.html">Kontakti</a>
        </div>

        <div class="footer-copy">© 2026 Restaurant DOLLARI. All rights reserved.</div>
      </div>
    </footer>

    <button class="back-to-top" aria-label="Go back to top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>

    <script src="js/script.js"></script>
  </body>
</html>
